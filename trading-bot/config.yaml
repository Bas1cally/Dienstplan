# === Hyperliquid Trading Bot Konfiguration ===

# Netzwerk: erst auf dem Testnet beweisen, dann mainnet
network: testnet          # testnet | mainnet

# dry_run: true = Signale werden nur geloggt, keine Orders.
# Erst auf false stellen, wenn Backtest UND Testnet-Lauf überzeugen.
dry_run: true

market:
  coin: BTC               # Hyperliquid Perp-Symbol (BTC, ETH, SOL, ...)
  interval: 1h            # Candle-Intervall: 1m 5m 15m 1h 4h 1d
  lookback_candles: 300   # Historie für Indikatoren
  dexs: auto              # auto = ALLE Perp-DEXs: Krypto + Builder-DEXs mit
                          # Aktien (TSLA, NVDA, ...), Gold, Silber, Öl - alles
                          # mit Leverage. Alternativ Liste oder "main".

strategy:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  rsi_overbought: 70      # keine neuen Longs darüber
  rsi_oversold: 30        # keine neuen Shorts darunter
  atr_period: 14
  allow_shorts: true

# Day-Trading-Profil: aggressiver als die konservativen Ur-Defaults (3x / 0.5).
# Ehrlicher Hinweis: mehr Leverage = mehr Reward UND mehr Risiko - der
# Circuit Breaker bei -5%/Tag ist die Grenze, die das überlebbar hält.
risk:
  risk_per_trade: 0.01    # max. 1% des Kapitals Risiko pro Trade (Trendfolge-Bot)
  atr_stop_mult: 2.0      # Stop-Loss-Abstand = 2 x ATR
  take_profit_r: 2.0      # Take-Profit bei 2R (2x Risiko)
  max_leverage: 4         # hartes Leverage-Limit (Validierung deckelt bei 10)
  max_daily_loss: 0.05    # Bot stoppt bei -5% Tagesverlust (Circuit Breaker)
  max_total_drawdown: 0.10 # Max-Drawdown-Halt vom Startkapital (Prop-Firmen-Regel)
  slippage: 0.005         # max. Slippage bei Market Orders (0.5%)

# === Ausführung ===
# hyperliquid = Orders direkt auf Hyperliquid (live/testnet)
# signals     = Bot analysiert + trackt im Paper-Modus, jede Order wird als
#               Ticket emittiert (Telegram + runtime/signals.jsonl + optional
#               SIGNAL_WEBHOOK_URL) - für Prop-Accounts ohne API wie Breakout.
#               ACHTUNG: Prop-ToS prüfen (Copy-Trading/Automation oft verboten)!
execution:
  mode: hyperliquid
  maker_first: true       # Edge 1: Post-Only-Limit zuerst (~0.015% statt 0.045%+Slippage),
  maker_timeout_s: 20     # Market nur als Fallback; Glattstellungen/Stops immer Market

# === Edge 3: Funding-Tilt (Carry) ===
# Positionen, die Funding ZAHLEN würden, werden verkleinert (bis pay_scale),
# Positionen, die Funding KASSIEREN, leicht vergrößert (bis earn_boost).
# Ändert nie die Richtung; Caps greifen nach dem Tilt. Builder-DEX-Assets neutral.
funding_tilt:
  enabled: true
  min_apr: 0.10           # |Funding| unter 10% p.a. = neutral
  max_apr: 0.50           # ab 50% p.a. voller Tilt
  earn_boost: 1.10
  pay_scale: 0.85
  cache_seconds: 300

backtest:
  fee_rate: 0.00045       # Hyperliquid Taker Fee (0.045%)
  maker_fee_rate: 0.00015 # Paper-Annahme bei maker_first (leicht optimistisch)
  slippage: 0.0002        # angenommene Slippage pro Fill
  initial_equity: 10000

copytrade:
  leaders_file: leaders.json   # Ergebnis von analyze_traders.py (manuell editierbar)
  max_leaders: 6               # mehr Signalquellen fürs Paper-Trade = belastbarere Daten
  copy_ratio: 0.6              # Day-Trading-Profil: etwas aggressiver allokieren
  max_alloc_per_coin: 0.25     # max. 25% der Equity in einem Coin
  rebalance_threshold: 0.035   # erst ab 3.5% Equity-Abweichung handeln (Fees fraßen 42%)
  min_notional: 10             # Hyperliquid-Mindestordergröße
  poll_seconds: 20             # Frequenz-Drossel gegen Churn (Copy-Lag bei >30min-Holds egal)
  feed_only: true              # QUEST-BOT: das Kopier-Buch handelt NICHT mehr selbst -
                               # es liefert nur noch Preise + Leader-Snapshots für den
                               # Quest-Bot und die Discovery. Es gibt nur noch den
                               # Quest-Bot, der die Schatztruhe füllt (Nutzer 15.07.).
  analysis:
    days: 21                   # kürzeres Fenster - Day-Trader-Form ist schnelllebig
    min_account_value: 1000    # Nutzer-Fund (17.07.): 10.000 filterte "Shrimps"
                               # (kleine, aktive Day-Trader mit guter Trefferquote)
                               # schon VOR der Sortierung raus - obwohl HLs eigenes
                               # Board nach ROI% sortiert (leaderboard.py), nicht
                               # nach absolutem PnL, sind sie size-unabhängig
                               # sichtbar, sobald sie diesen Boden schaffen. Das
                               # Hauptbuch handelt ohnehin nicht mehr (feed_only),
                               # kein Risiko durch mehr Klein-Wallets im Rohpool -
                               # die Qualitätskontrolle bleibt bei Trefferquote/
                               # Drawdown/aktive Tage, nicht bei der Kontogröße.
    min_volume: 75000          # war 500000 - für ein 1000-2000$-Konto unrealistisch
                               # hoch, selbst bei aktivem Trading. Senkt NICHT die
                               # Qualitätslatte (das tun die LARP-/Sprint-Gates),
                               # nur den Größen-Boden.
    top_percent: 2.0           # Top-2% (nach Monats-ROI) gehen in die Tiefenanalyse
    top_n: 110                 # harter Deckel für die Tiefenanalyse (API-Calls je
                               # Wallet). 90->110 (18.07., Flow-Runde): mehr Breite
                               # für den auf 25 vergrößerten Pool; ~+20 Wallets *
                               # ~1.5s Throttle = ~+30s je Analyse, läuft im
                               # Hintergrund-Thread (HL-Rate-Limit, kein CMM-Budget).
                               # Historie: 70->90 (17.07.) fürs dritte CMM-Fenster
                               # (pnlDay).
    min_score: 35              # Mindest-Score, um als Leader infrage zu kommen
    larp:                      # harte K.O.-Gates gegen Blender (bot/copytrade/larp.py)
      min_round_trips: 30            # weniger Trades = Zufall nicht ausschließbar
      min_active_days: 10
      max_single_trade_share: 0.40   # Lucky-Punch-Erkennung
      min_profitable_week_share: 0.60
      max_drawdown: 0.25             # überhebelte Konten aussortieren (Hauptbuch)
      min_median_holding_minutes: 30 # Scalper: Copy-Lag frisst deren Edge
      max_median_holding_minutes: 720 # Day-Trading: Swing-Trader (>12h Hold) raus
      sprint_max_drawdown: 0.50      # QUEST-Gambler-Filter (Nutzer 17.07.: Wallet mit
                                      # 61% Drawdown kam mit 90% Trefferquote locker
                                      # durch Pfad A, öffnete dann eine $20k-BTC-Position,
                                      # die massiv ins Minus lief - "das ist ganz klar
                                      # ein Gambler"). Lockerer als das Hauptbuch (0.25):
                                      # mehr Wallets sind weiter erwünscht, aber keine
                                      # historisch übertreibenden Konten mehr.
      sprint_min_active_days: 2      # QUEST (Nutzer 17.07., "3 und 4"; 18.07. von 3
                                      # auf 2 gesenkt): größter Volumen-Killer im
                                      # Sprint-Funnel war die Hauptbuch-Schwelle (10),
                                      # aber auch 3 schnitt noch Frequenz-Maschinen
                                      # weg (Live: 197 Trips/88% Trefferquote/Sprint-
                                      # Score 100 raus wegen "nur 2 aktive Tage").
                                      # 2 Tage schließen Ein-Tages-Zufall weiter aus.
      sprint_min_hold_minutes: 5     # QUEST-Scalper-Boden (Nutzer-Fund 18.07.): der
                                      # frühere abgeleitete Boden (Hauptbuch-Hälfte =
                                      # 15min) sortierte GENAU die Schnell-Trader aus,
                                      # die das "1 Trade pro Stunde"-Ziel liefern
                                      # können (Live: 53 Trips/75% raus wegen 1min
                                      # Hold; die einzige Signal-Wallet überhaupt
                                      # hatte 11-14min). Der Pool bestand danach nur
                                      # noch aus Portfolio-Haltern - 9/9 "holding",
                                      # stundenlange Signal-Stille. Nur noch echte
                                      # Sekunden-Scalper raus, Strikes urteilen den Rest.

# === Marktüberwachung: News + Preis-Schocks ===
# Schaltet beide Bots in CAUTION (nichts Neues) oder RISK_OFF (alles schließen).
news:
  enabled: true
  poll_seconds: 60
  rss_feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
  cryptopanic: false      # kostenloser Token: CRYPTOPANIC_TOKEN in .env
  twitter: false          # TWITTER_BEARER_TOKEN in .env; Achtung: teuer + nur Polling
  caution_score: 4        # ab diesem Score keine neuen Positionen
  risk_off_score: 8       # ab diesem Score alles glattstellen
  half_life_minutes: 30   # Score-Zerfall alter Schlagzeilen
  llm_enabled: false      # Claude bewertet jede Schlagzeile zusätzlich (ANTHROPIC_API_KEY in .env)
  llm_model: claude-opus-4-8   # günstiger/schneller: claude-haiku-4-5

shock:                    # die schnelle Verteidigung - direkt auf 1m-Preisdaten
  enabled: true
  window_minutes: 5
  move_threshold: 0.025   # 2.5% Move in 5min -> RISK_OFF
  vol_spike_ratio: 4.0    # Kurzfrist-Vola 4x über Stunden-Vola -> RISK_OFF
  cooldown_minutes: 30

# === Autopilot: Vollautomatik (server.py / autopilot.py) ===
autopilot:
  reanalyze_hours: 3      # 6 -> 3 (18.07., Flow-Runde): schnellere Pool-Rotation -
                          # Wallets, die HEUTE aktiv geworden sind, kommen in
                          # Stunden statt erst am Folgetag rein, tote Halter
                          # fliegen doppelt so schnell raus. Läuft im
                          # Hintergrund-Thread, blockiert den Tick-Loop nicht.
  min_keep_score: 35      # Leader unter diesem Score werden ausgetauscht
  realtime: true          # Edge 2: WebSocket - Leader-Fills wecken den Loop sofort
  autostart: true         # 24/7-Betrieb (VPS/systemd): startet ohne Dashboard-Klick
  daily_digest: true      # Tagesbericht per Telegram/Log
  watchdog_hours: 24      # Alarm + Diagnose, wenn so lange keine Order kam
  shadow_variants: false  # SPRINT-FOKUS (15.07.): aus. War A/B-Tuning fürs
                          # Haupt-Buch (ohne_validator/validator_locker/
                          # crash_only) - alle 3 Varianten liefen im 33-Tage-
                          # Report schlechter als das eh schon rote Haupt-Buch.
                          # Wieder an, falls das Haupt-Buch später wieder
                          # Entwicklungs-Fokus bekommt.
  server_host: 127.0.0.1  # Web-UI nur lokal - NIE ungeschützt ins Internet!
  server_port: 8000

# === VolScalper: Gegenbewegung nach Volatilitäts-Schocks (EXPERIMENTELL) ===
# Handelt die Mean-Reversion nach Liquidations-Kaskaden, während der Copy-Bot
# im Schock-Cooldown draußen ist. Härteste Strategie im Bot: Fees+Slippage
# fressen dünne Edges, manchmal fällt das Messer weiter. Default AUS -
# erst aktivieren, wenn der Paper-Lauf der anderen Module überzeugt hat.
scalp:
  enabled: false
  coin: BTC                 # nur der liquideste Markt
  risk_per_scalp: 0.005     # max. 0.5% Equity Risiko pro Scalp
  stabilize_minutes: 3      # Mindestabstand zum Schock-Event
  confirm_candles: 3        # 1m-Candles ohne neues Extrem = stabilisiert
  entry_window_minutes: 25  # danach ist das Event verfallen
  stop_buffer: 0.002        # Stop knapp hinter dem Move-Extrem
  retrace_target: 0.382     # TP bei 38.2% Retrace des Spikes
  max_holding_minutes: 30   # Zeit-Stop - ein Scalp wird nie eine Dauerposition
  max_notional_frac: 0.15   # max. 15% Equity Notional

# === Sprint-Buch: 1000$ x10 auf den BESTEN Leader (BTC gesperrt, 19.07.) ===
# Eigenes Paper-Konto: spiegelt die Positionen des jeweils besten Leaders der
# laufenden Rotation mit vollem, coin-abhängigem Hebel (leverage_overrides
# unten). Bei +100$ (10%) Take-Profit -> Gewinn gebucht ("banked"), Konto auf
# 1000 zurückgesetzt, nächster Zyklus. Fällt die Equity unter bust_frac, gilt
# der Zyklus als liquidiert (Hebel-Realität) und startet ebenfalls neu.
# RISK_OFF stellt auch dieses Buch glatt.
sprint:
  enabled: true
  equity: 1000
  leverage: 10               # Basis-Hebel für alle Coins ohne eigenen Eintrag
                             # unten in leverage_overrides.
  leverage_overrides: {}     # MAJORS-OVERRIDES RAUS (Nutzer 19.07., Edge-Runde:
                             # "Majors sind wir raus"): BTC x20/ETH x15 waren das
                             # Experiment vom 17.07. - die Daten sagen dagegen:
                             # die großen Bleeds kamen von Mega-Hebel-Majors
                             # (BTC 20x: -180$), ALLE großen Gewinner von
                             # High-Vol-Coins mit Basis-Hebel. Alles wieder 10x.
  target_profit: 100
  max_positions: 1          # EIN Ritt = EINE Position. Live-Vorfall: Leader
                            # eröffnete einen 7-Coin-Aktien-Korb, der Bot fraß
                            # alle 7 und verschmierte die 10x-Kapazität. Jetzt
                            # gewinnt das stärkste Signal (|exposure| des
                            # Leaders), der Rest wird sichtbar verworfen.
  parallel_rides: true      # NUTZER 17.07. - ZURÜCK IN DEN MESS-MODUS: nach den
                            # heutigen Änderungen (Gambler-Filter, gesenkte
                            # Größen-Böden/Shrimps, Hebel-Kappung, manuelle
                            # Closes striken jetzt) soll erstmal wieder BREIT
                            # gemessen werden - viele Wallets gleichzeitig
                            # sammeln Strikes/Confidence unter den NEUEN Regeln,
                            # statt seriell einen nach dem anderen durch den
                            # einzigen Ritt-Slot zu schleusen. ENDZIEL bleibt
                            # false (POOL -> EIN GUTER RITT -> +10% -> RAUS),
                            # aber erst nach dieser zweiten Datenflut wieder.
  max_rides: 20             # 8 -> 20 (17.07.): "Datenflut" heißt so viel vom
                            # 20er-Pool wie möglich gleichzeitig messen, nicht
                            # künstlich auf 8 drosseln, während Kapazität da wäre.
  counter_toxic: true       # TOXIC FLOW (Nutzer 20.07.: "unsere gestrikten
                            # Leader werden ab sofort counter traded"): frische
                            # Signale GEBANNTER Leader werden invertiert
                            # geritten statt verworfen (Spiegel: 119x
                            # leader_gesperrt = verschenkte Datenpunkte).
                            # Gegenwetten laufen unter "counter:<addr>" mit
                            # EIGENEM Strike-Konto - verliert die Gegenwette
                            # wiederholt (Leader hatte doch recht), bannt sich
                            # die Counter-Identität selbst. Gebannte HL-Wallets
                            # bleiben dafür beobachtet (Toxic-Watch, max 12).
  toxic_record_deficit: 3   # TOXIC-BY-RECORD (Spiegel-Fund 20.07.): "/quest
                            # amnestie" leert `banned` komplett - Toxic Flow
                            # hatte danach 78min kein Futter mehr, obwohl
                            # dieselben Leader ihre miese Bilanz nie verloren
                            # hatten (leader_record überlebt Amnestien bewusst).
                            # Ein Leader gilt zusätzlich als toxisch, wenn er im
                            # eigenen Buch mind. 3 Zyklen mehr verloren als
                            # gewonnen hat - unabhängig vom (amnestierbaren)
                            # Strike-Stand. 0 = aus (nur formell Gebannte).
  trail_frac: 0.3           # EDGE-RUNDE (19.07.): Trailing-TP statt fixem Ziel.
                            # Ab +target_profit wird NICHT mehr geschlossen,
                            # sondern der Peak getrailt - Exit erst bei 30%
                            # Rückfall vom Peak (oder Leader-Exit). Datenbasis:
                            # ALLE großen Gewinner waren Überschießer (+225/
                            # +220/+112 bei +100-Ziel) - das fixe Ziel kappte
                            # systematisch den rechten Tail. Preis: knappe
                            # Zielerreicher geben bis zu 30% wieder her.
  hot_hand_extra_rides: 2   # EDGE-RUNDE: Leader mit >= 1 Gewinn-Zyklus im
                            # EIGENEN Buch bekommen 2 Extra-Slots (also 4
                            # statt 2) - Kapazität folgt der heißen Hand
                            # (beste Signal-Quelle wurde 6x leader_belegt
                            # gedrosselt, während No-Names gleich viel hatten).
  hot_hand_size_mult: 1.5   # EDGE-RUNDE: ab 2 Gewinn-Zyklen im eigenen Buch
                            # 1.5x Notional - Größe folgt Beweisstand, niemand
                            # wird kleiner als Basis (Rookies unverändert 1.0x).
  trusted_skip_confirm: true # EDGE-RUNDE: bewiesene Leader (>= 1 Gewinn-Zyklus)
                            # überspringen das 10s-Bestätigungsfenster - früh
                            # ist bei Momentum die halbe Edge. Das Fenster
                            # bleibt Anti-Flip-Flopper-Schutz für No-Names.
  plus_lock_arm: 30         # PLUS-SICHERUNG (Nutzer 19.07.: "sobald wir im Plus
                            # sind sollten wir nie mit Minus rausgehen" - Ritte
                            # standen ordentlich im Plus und endeten Stunden
                            # später per Zeit-Cut/Leader-Exit im Minus). War der
                            # Ritt-Peak einmal >= 30$ (3% der Basis, deutlich
                            # über dem Fee-Rauschen von ~9$), wird beim Rückfall
                            # auf plus_lock_floor geschlossen: klein-grün statt
                            # rot. 0 = aus.
  plus_lock_floor: 15       # Exit-Schwelle der Plus-Sicherung. 5 -> 15 (Spiegel-
                            # Fund 20.07.): mit +5$ Floor landeten echte Exits
                            # bei -13/-13/-71 - zwischen zwei Ticks (unter Last
                            # bis ~90s!) fällt der Preis durch den Floor DURCH,
                            # geprüft wird erst der nächste Tick. +15$ Puffer
                            # fängt normale Tick-Gaps; echte Kurs-Sprünge kann
                            # kein Paper-Floor der Welt abfangen (auch live
                            # slippen Stops). Reason "plus_lock" bleibt
                            # strike-exempt: unsere Sicherungs-Regel, nicht die
                            # Entscheidung des Leaders.
  wrong_way_stop: 50        # FALSCHRICHTUNGS-STOP (Nutzer-Entscheidung 25.07.
                            # nach dem Tages-Check): EIN Ritt (0xf224d1b2 auf
                            # STX) machte -270.78$ = 97% der Tagesbilanz. Der
                            # Zeit-Cut feuerte korrekt nach genau 2h - da war
                            # der Schaden aber längst da. Nach oben ist alles
                            # austariert (Trail lässt laufen, Plus-Lock sichert
                            # ab +30$ bei +15$), nach unten klaffte zwischen 2h
                            # und bust bei -95% ein Loch: größter Gewinn
                            # +69.80$ gegen größten Verlust -270.78$ = Faktor
                            # 3.9, das verhindert Profitabilität mathematisch.
                            # BEWUSST schmal: greift NUR bei Ritten, deren Peak
                            # nie plus_lock_arm (30$) erreicht hat - die also
                            # von Anfang an falsch lagen. Wer schon im Plus
                            # war, behält volle Freiheit (dort übernimmt
                            # Plus-Lock/Trail). Keine Edge-Dämpfung, sondern
                            # das Schließen einer Schieflage. NICHT
                            # strike-exempt: hier lag der Leader wirklich
                            # falsch. 0 = aus.
  fast_check_seconds: 1     # FAST-PATH (Spiegel-Fund 22.07.): trotz 15$-Floor
                            # schoss Plus-Lock live bis zu -33.57$ ins Minus
                            # durch - der volle Tick lief nur alle poll_seconds
                            # (20s), ein 10x/10-15k$-Ritt bewegt sich in dieser
                            # Zeit weiter als der Floor-Puffer gibt. Zwischen den
                            # vollen Ticks NUR Ziel/Plus-Lock/Bust/Zeit-Cut mit
                            # bereits vorhandenen (kostenlosen) WS-Mids nach-
                            # schauen - kein Leader-Scan, kein Netz-Budget, reiner
                            # Exit-Reflex, praktisch kostenlos (nur Dict-Lookups
                            # über die paar offenen Ritte). 5 -> 1s (22.07.,
                            # Nutzer: "wie wär's mit ner Lösung" nach einem
                            # weiteren -7.24$-Overshoot TROTZ Fast-Path) - 1s
                            # ist die praktische Untergrenze für sinnvoll engere
                            # Checks (WS-Mids selbst kommen nicht garantiert
                            # schneller). Senkt das Gap-Fenster nochmal 5x
                            # (20s -> 5s -> 1s), eliminiert das physikalische
                            # Grund-Restrisiko (ein einzelner Preis-Sprung
                            # INNERHALB eines Checks) aber nicht vollständig.
                            # 0 = aus.
  max_rides_per_leader: 2   # 1 -> 2 (18.07., Flow-Runde): das 1er-Limit war der
                            # größte Frequenz-Deckel des Live-Tags - 5 von 9
                            # frischen Signalen starben an "leader_belegt", alle
                            # von der besten Signal-Maschine des Pools. Der
                            # Methodik-Einwand (korrelierter Mehrfach-Basket
                            # EINES Leaders sieht aus wie unabhängige Messpunkte)
                            # bleibt beachtet: 2 statt unbegrenzt, und das
                            # Journal attribuiert jeden Ritt seinem Leader -
                            # Korrelation bleibt in den Daten auswertbar, statt
                            # im Verwerfen zu verschwinden.
  confirm_delay_s: 10       # Flip-Flopper-Schutz: frisches Signal erst nach 10s
                            # durchgehend positiver Leader-PnL reiten, nicht
                            # blind instant (Live-Befund: Leader schießt nach
                            # Einstieg sofort ins Minus und flippt Sekunden
                            # später zurück). 0 = aus (altes Sofort-Verhalten).
  confirm_tolerance: 0.002  # Spread-Toleranz dazu (Live-Fund 18.07.: die ersten
                            # 2 frischen Signale nach dem Frequenz-Fix wurden
                            # BEIDE als "unbestaetigt_negativ" verworfen, beide
                            # xyz:BRENTOIL). Der Leader füllt am Ask/Bid, wir
                            # vergleichen gegen den Mid - direkt nach jeder
                            # Eröffnung sieht die Position ~einen halben Spread
                            # "im Minus" aus, ohne echte Marktbewegung. Bis 0.2%
                            # unter Entry gilt als Spread-Rauschen, erst darunter
                            # als echtes Flip-Flopper-Warnsignal. Besonders
                            # relevant für Builder-DEX-Perps (Öl/Aktien, breite
                            # Spreads).
  crypto_only: false        # AKTIEN-REGIME ENTFERNT (Nutzer 17.07.): "24/7 alles
                            # erlaubt" - Krypto UND Aktien-Perps jederzeit
                            # zulässig, kein Umschalten mehr zum Börsen-Gong
                            # (siehe stock_market_hours: false unten). Dieser
                            # statische Wert gilt jetzt durchgehend.
  stock_market_hours: false # AUS (Nutzer 17.07.): kein automatisches Auf/Zu von
                            # crypto_only mehr zum US-Börsen-Gong - Aktien-Perps
                            # laufen jetzt außerhalb der Sitzung genauso mit
                            # (akzeptiertes Risiko: Kurs kann dann stale sein).
                            # _maybe_market_gong() wird dadurch komplett zum
                            # No-Op, Mechanismus bleibt im Code für eine
                            # mögliche spätere Reaktivierung.
  pool_size: 25             # 20 -> 25 (18.07., Flow-Runde): mehr Scan-Slots für
                            # die zusätzlichen Kandidaten aus top_n 110 + Lighter.
                            # Sprint scannt einen breiteren Leader-Pool als das
                            # Hauptbuch (max_leaders: 6). Sprint hält immer nur EINE
                            # Position -> mehr Quellen = weniger Leerlauf, ohne die
                            # Qualität der Einstiege zu senken (bestbewerteter Leader
                            # mit frischem Signal gewinnt immer). Betrifft NUR Sprint,
                            # das Hauptbuch bleibt bei seinen 6 konzentriert.
  pool_min_score: 10        # Mindest-RICHTUNGS-Score (0..100) - bewusst nur ein
                            # Anti-Müll-Boden, KEIN Vorab-Urteil. Philosophie
                            # (Nutzer): das Sprint-Buch ist Papier mit Strike-
                            # Maschine - ob ein Leader gut/schlecht/Flipper ist,
                            # zeigen 1-2 Ritte (2 Strikes = Bann), Über-Filterung
                            # dagegen kostet die ganze Messung (Live: Pool auf 6
                            # geschrumpft, tagelange Dürre). Gate-Rest: Trefferquote
                            # >=45% (nur systematische Falsch-Trader raus), >=8
                            # Trades, Mini-Scalper-Boden (sprint_min_hold_minutes),
                            # ODER grünes offenes Buch >=55%. Hauptbuch: min_score 35.
  path_b_max_share: 0.35    # Deckel für Pfad-B-Wallets ('Positions-Trader mit
                            # grünem offenen Buch') als Anteil von pool_size, fest
                            # an der Admission, nicht nur an der Pool-Sortierung.
                            # Live-Befund (18.07.): sprint_ok lag fast immer UNTER
                            # pool_size (20), die reine Nachrang-Sortierung schnitt
                            # nie etwas ab -> Pool war zu ~10/18 mit Sitzern voll,
                            # die strukturell NIE ein frisches 0->Position-Signal
                            # geben können (0 Signale in ~2h trotz gefixter Sortierung).
  bust_frac: 0.05           # Liquidations-Modell: unter 5% Rest ist der Zyklus geplatzt
  partial_exit_frac: 0.75   # Leader baut >=75% ab -> wir gehen mit raus (Scale-out)
  add_signal_frac: 0.25     # 0.5 -> 0.25 (18.07., Flow-Runde): der Pool besteht
                            # live fast komplett aus Positions-Haltern (watch:
                            # 15/15 holding) - deren Überzeugungs-Moment ist das
                            # Aufstocken, und +50% ist dafür eine seltene Hürde.
                            # +25% fängt deutlich mehr echte Nachkauf-Momente;
                            # Bestätigungsfenster + Strikes policen schwache.
                            # Aufstockung >=25% oder Richtungs-Flip im Bestand zählt
                            # als frisches Signal (nur im FLACH-Scan). Grund: der
                            # Richtungs-Pool besteht aus Positions-Tradern - die
                            # eröffnen selten neu (Live: voller Handelstag, 0 frische
                            # Signale bei 8/8 Feed-Abdeckung), ihr Überzeugungs-
                            # Moment ist das AUFSTOCKEN. 0 = aus (nur 0->Position).
  strike_ban: 2             # 2 Verlust-Ritte -> Leader fürs Sprint-Buch gesperrt
  max_ride_hours: 2         # QUEST (Nutzer): ein Ritt, der >2h offen UND im Minus
                            # ist, wird gecuttet - er blockiert nur den einzigen
                            # Slot und blutet (Live: 4h im Minus, dann -230$ beim
                            # Leader-Exit). Im Plus wird NICHT gecuttet. 0 = aus.
  rotate_idle_hours: 6      # QUEST: eine Wallet, die seit Pool-Eintritt >6h KEIN
                            # frisches Signal gab, wird beim nächsten Rebuild nach
                            # hinten rotiert - frische Kandidaten bekommen Vorrang
                            # (Nutzer: 'scannen scannen Daten'). Stars ausgenommen.
                            # 0 = aus. Sinnvoll ~ autopilot.reanalyze_hours (6h).
  regime_min_crypto_share: 0    # AUS (Nutzer 17.07., Aktien-Regime entfernt): mit
                            # crypto_only durchgehend false greift dieser Filter
                            # ohnehin nie (nur relevant wenn crypto_only=true) -
                            # 0 = altes/deaktiviertes Verhalten, hier zur
                            # Klarheit explizit gesetzt statt nur implizit tot.
  exclude_coins: [BTC]       # BTC-SPERRE WIEDER AKTIV (Nutzer 19.07., Edge-
                            # Runde: "btc sperren, das war nur weil wir null
                            # Signale hatten"). Der Testlauf vom 17.07. ist
                            # ausgewertet: BTC-Ritte lieferten die größten
                            # Bleeds (-167 manuell, -180 zeit_negativ), keinen
                            # einzigen TP - Beta statt Alpha, wie ursprünglich
                            # vermutet. Signal-Not besteht nicht mehr (Flow-
                            # Runde), also zurück zur Sperre.

# === Lighter (zkLighter): fremde Trader auto-entdecken + auf HL messen ===
# Probe hat bestätigt: Lighter gibt fremde Positionen öffentlich her. Der Bot
# findet aktive Konten selbst (Trade-Strom), bewertet sie und kopiert die Top-N
# gleichgewichtet in ein PAPER-Buch, gepreist mit HL-Preisen - reine Messung,
# kein Einfluss aufs Haupt-Buch. Read-only, Ausführung bleibt Hyperliquid.
lighter:
  enabled: true            # AN (18.07., Flow-Runde, Nutzer-Go): Voraussetzung
                          # für sprint_promote unten - self.lighter wird nur
                          # bei enabled gebaut. Der alte -8.22%-Report der
                          # isolierten Messung betraf eine andere Mechanik
                          # (Dauer-Rebalancing auf Zielgewichte), nicht das
                          # Sprint-Signalmodell (frisches 0->Position, Strike-
                          # Bann) - fürs Sprint-Buch policen Strikes/Bans und
                          # der Zeit+negativ-Cut die Lighter-Leader genauso wie
                          # jeden HL-Leader.
  auto_discover: true
  coins: [BTC, ETH, SOL, HYPE, DOGE, AVAX, LINK, ARB]  # nur auf HL handelbare
  scan_seconds: 300
  max_candidates: 40
  min_equity: 5000
  max_leaders: 5
  copy_ratio: 0.5
  sprint_promote: true     # AN (18.07., Flow-Runde, Nutzer-Go): zweite Börse
                          # als unabhängige Signal-Quelle fürs Sprint-Buch,
                          # inkl. Staleness-Schutz (sprint_snapshots liefert
                          # leer, wenn der letzte erfolgreiche Scan älter als
                          # 3x scan_seconds ist).
                          # Ursprünglich (17.07., Option B): Lighter-
                          # Signale zusätzlich ins Sprint-Buch einspeisen
                          # (eigener lighter:-Adress-Namensraum, kollidiert nie
                          # mit echten HL-Adressen). EIGENER Schalter, getrennt
                          # von enabled oben - braucht BEIDE an. Lighter hat
                          # kein Ranking-API (keine Fill-Historie -> kein LARP-/
                          # Drawdown-Gate wie bei HL-Kandidaten möglich) - die
                          # Qualitätskontrolle übernehmen bei diesen Leadern
                          # ausschließlich Strikes (2 Verlust-Ritte -> Bann)
                          # und der Zeit+negativ-Cut, kein Vorab-Filter.

# === HyperTracker (CoinMarketMan): reichhaltiges Leader-Leaderboard ===
# Vorberechnetes Perp-PnL-Leaderboard (Tag/Woche/Monat/all-time) + Exposure,
# Directional Bias - ersetzt den schmalen HL-Leaderboard-Trichter bei der
# Kandidaten-Discovery (Problem: nur 1 qualifizierter Leader). Das Qualitäts-Gate
# (30-Tage-Tiefenanalyse + LARP-Filter) und das Live-Position-Tracking bleiben
# bei HLs kostenlosem API (Rate-Hygiene: Free-Tier = 100 Requests/TAG, Discovery
# alle reanalyze_hours = 4 Requests/Tag). Fällt CMM aus -> automatisch alter Weg.
# Token NICHT hier - COINMARKETMAN_TOKEN in der .env (per Telegram /setcmm setzbar).
# Live-Probe 13.07.2026: Contract bestätigt (perp-pnl, Zahlen als Strings).
coinmarketman:
  enabled: true
  period: pnlMonth          # pnlDay | pnlWeek | pnlMonth | pnlAllTime
  limit: 100                # Leaderboard-Zeilen pro Abruf (25 | 50 | 100)
  min_equity: 1000          # Nutzer-Fund (17.07.): 10.000 schloss "Shrimps" (kleine,
                            # aktive Day-Trader mit guter Trefferquote) schon vorab
                            # aus. WICHTIG: CMM rankt weiterhin nach absolutem PnL
                            # (pnlDay/Week/Month, kein Win-Rate-Feld) - ein Shrimp
                            # mit kleinem PnL bleibt auf dem Board trotzdem weit
                            # unten, dieser Boden nimmt nur die HARTE Ausschluss-
                            # Grenze weg. Der eigentliche Hebel für Shrimps ist HLs
                            # eigenes Board (leaderboard.py, sortiert nach ROI% -
                            # size-unabhängig), s. copytrade.analysis.min_account_value.
  min_pnl: 0                # ... und Monats-PnL muss positiv sein
  # Kopierbarkeits-Filter (Live-Befund 13.07.: Board-Spitze = MM/HFT-Whales mit
  # 400x Monats-Umsatz - unkopierbar, und ihre >2000 Fills sprengen HLs
  # userFills-Fenster, sodass die Tiefenanalyse nur verzerrte Ausschnitte sieht):
  max_turnover: 120         # Monatsvolumen/Equity-Deckel (Day-Trader ~5-100x)
  max_exposure: 6           # |offenes Notional / Equity| (Hebel-Deckel)
  max_equity: 5000000       # darüber fast nur Fonds/MMs (Slippage-Realität)
  periods: [pnlDay, pnlWeek, pnlMonth]  # Nutzer (17.07.): "wir brauchen mehr
                            # daytrader" - pnlDay NEU dazu und ZUERST (Interleave-
                            # Priorität, siehe _discover_candidates): reine
                            # Tages-Rangliste, wer HEUTE vorn ist, hat heute
                            # gehandelt - trifft "Day-Trader" direkter als das
                            # Wochen-Board. pnlWeek/pnlMonth bleiben als Auffang
                            # für Trader mit ruhigerem Tagesrhythmus.
                            # 3 Fenster x 3 Seiten = 900 Kandidaten roh, 9 Requests
                            # je Analyse. Budget: 9 x ~5 Analysen/Tag = ~45 von
                            # 100/Tag - weiter Puffer für /cmm-Proben.
  pages: 3                  # Board-Seiten JE FENSTER je Scan (je 1 Request)

# === Status-Spiegel: JSON-Schnappschuss fürs Repo (Claude-Lesezugriff) ===
# Nutzer (17.07.): "Ressourcen Verschwendung alles hier spiegeln zu müssen" -
# statt jeden Zustand manuell aus Telegram zu kopieren, schreibt der Bot
# periodisch einen Snapshot (Positionen, Pool, Funnel, Journal-Tail) über
# GitHubs Contents-API in einen dedizierten Branch. Kein Tunnel, kein neuer
# öffentlicher Endpunkt, rührt den bestehenden manuellen git-pull-Deploy-Flow
# NICHT an (eigener API-Call, keine lokalen git-Befehle in der Arbeitskopie).
status_push:
  enabled: true              # Gate ist ohnehin der Token: ohne STATUS_PUSH_TOKEN
                            # (per /setstatuspush <token> setzbar, kein SSH
                            # nötig) bleibt push_snapshot() ein No-Op (siehe
                            # bot/status_push.py) - dieses Flag ist der zweite,
                            # explizite Schalter (Muster wie coinmarketman.enabled).
  repo: bas1cally/dienstplan
  branch: status-feed       # dedizierter Branch, kein Rauschen im Code-Verlauf
  path: trading-bot/status/quest_status.json
  interval_minutes: 5       # wie oft (Mindestabstand) neu geschrieben wird

# === Strategie-Labor: eigene Signale parallel im Paper-Schatten messen ===
# Der Copy-Bot folgt fremden Tradern (kein originäres Alpha). Hier laufen EIGENE
# Strategien mit Spielgeld parallel mit, damit der Report (python report.py)
# schwarz auf weiß zeigt, ob das Signal trägt - BEVOR Kapital fließt.
#  - trend:   die "meistgenudelte" EMA/RSI-Trendstrategie (erbt strategy:-Block).
#             Ehrlich: Standard-TA ist nach Fees meist nahe null - wir messen es.
#  - funding: Funding-Capture - die kassierende Seite halten, solange Funding
#             extrem ist. KEIN delta-neutrales Arb (ohne Spot-Hedge bleibt
#             Kursrisiko, durch Stop + Zeitlimit begrenzt) - der Carry ist der Edge.
labs:
  enabled: false           # SPRINT-FOKUS (15.07.): aus. Im 33-Tage-Report:
                          # eigene_ta -85.60$ PnL, funding_capture +16.02$ auf
                          # nur 7 Episoden (nicht signifikant) - kein Edge
                          # bewiesen, kostet nur Entwicklungs-Aufmerksamkeit.
  trend:
    enabled: true
    coin: BTC
    interval: 1h
    risk_frac: 0.01         # 1% Equity-Risiko pro Trade (über die Stop-Distanz)
    max_notional_frac: 0.25
  funding:
    enabled: true
    coins: [BTC, ETH, SOL, HYPE]
    entry_apr: 0.30         # ab |Funding| >= 30% p.a. die kassierende Seite einnehmen
    exit_apr: 0.10          # unter 10% p.a. wieder raus
    stop_frac: 0.03         # harter Kurs-Stop 3% gegen die Position
    max_hold_hours: 24
    max_positions: 3
    risk_frac: 0.02         # Notional pro Position (2% Equity)

# === TWAP-Scout: laufende TWAP-Ausführungen großer Wallets aufspüren ===
# Ein TWAP zerlegt eine Großorder in gleich große Slices im festen Takt - das
# mechanische Treppchen, mit dem z.B. Tron/Justin Sun über Stunden akkumuliert.
# Ein LAUFENDER TWAP = anhaltender Richtungsdruck, solange er läuft. Hyperliquid
# taggt Slices nativ (userTwapSliceFills). Geprüft werden Watchlist + bekannte
# Whales (extra_addresses) + Leader + frische Anomalie-Funde. HANDELT NIE.
# Tipp: bekannte Tron/Sun-Adressen unter extra_addresses eintragen für gezieltes
# Tracking. Ehrlich: bis die Slice-Kadenz erkennbar ist, ist ein Teil gelaufen.
twap:
  enabled: false           # SPRINT-FOKUS (15.07.): aus (read-only Beobachter,
                          # kein Einfluss auf Sprint - reine Aufmerksamkeit).
  poll_seconds: 120
  active_window_minutes: 20     # Slices in diesem Fenster = TWAP läuft gerade
  min_slices: 4                 # so viele jüngste Slices = aktiver TWAP
  max_checks_per_scan: 8
  extra_addresses: []           # z.B. ["0x...", "0x..."] bekannte Whale-Wallets

# === Orderbuch-Scout: Mikrostruktur (Imbalance, Walls, dünne Liquidität) ===
# Der Anomalie-Scout sieht nur ausgeführte Trades; dieser liest das L2-Orderbuch:
# Bid/Ask-Imbalance, große Walls (Support/Resistance). Eine der ECHTEN
# strukturellen Edges. HANDELT NIE - meldet + hält den Preis fest, damit der
# Report die Vorhersagekraft misst. Ehrlich: nicht-kolokiertes Polling fängt
# nur langsame Signale, kein HFT/Spoofing; Follow-through im 1h-Raster ist grob.
orderbook:
  enabled: false            # SPRINT-FOKUS (15.07.): aus. Im 33-Tage-Report
                            # -0.05% Follow-through auf 100 Episoden, nicht
                            # signifikant - kein bewiesener Edge, kein Sprint-Bezug.
  notify: false             # KEIN Telegram-Spam - Daten landen still im Report
  coins: [BTC, ETH, SOL, HYPE]
  poll_seconds: 300         # 1h UND 15min ohne Edge -> seltener pollen, weniger Last
  band_pct: 0.005           # nur Levels innerhalb 0.5% um den Mid zählen
  imbalance_threshold: 0.65 # |Imbalance| ab hier melden (0.5 erzeugte 10913 Signale = Rauschen)
  min_signal_gap_s: 900     # min. 15min zwischen Signalen je Coin (gegen Pendeln)
  wall_ratio: 5.0           # Level >= 5x mittlere Größe = Wall

# === Anomalie-Scout: "verdächtig gut informierte" Wallets aufspüren ===
# Liest den ÖFFENTLICHEN Trade-Strom (jeder Fill auf Hyperliquid ist on-chain
# einsehbar) und meldet das klassische Muster "frische Wallet + sofort große,
# konzentrierte Wette" per Telegram + Journal + runtime/anomalies.jsonl.
# NUR Beobachtung - der Scout handelt nie und beeinflusst keine Order.
# Ehrlich: viele Treffer sind nur Whales mit neuer Wallet - erst Treffer
# sichten (python investigate.py <adresse>), bevor man daraus mehr macht.
anomaly:
  enabled: false                  # SPRINT-FOKUS (15.07.): aus. Im 33-Tage-
                                  # Report +0.13% auf 20 Episoden, nicht
                                  # signifikant ("noch nicht überzeugend") -
                                  # kein Sprint-Bezug, reine Aufmerksamkeit.
  coins: [BTC, ETH, SOL, HYPE]    # dünne/neue Märkte ergänzen = mehr Insider-Flow, mehr Rauschen
  poll_seconds: 300
  min_trade_notional: 100000      # erst ab dieser Trade-Größe wird die Wallet geprüft
  min_position_notional: 100000   # ... und nur ab dieser Positionsgröße gemeldet
  lookback_days: 7
  max_prior_fills: 10             # mehr Historie davor = alter Hase, keine Meldung
  min_concentration: 0.6          # größte Position muss >= 60% des Buchs sein
  max_checks_per_scan: 5          # API-Budget je Scan (Rate-Limit-Hygiene)
  recheck_hours: 12

# === Polymarket-Scout: erfahrenes Geld in Prediction Markets (read-only) ===
# Polymarket läuft on-chain - sichtbare Wallets. Der Scout meldet, wenn eine
# Wallet mit nachweislich profitabler Historie eine große Wette platziert
# ("informed money"). SEPARATES Tier, HANDELT NIE - reine Beobachtung, damit
# wir über Wochen sehen, ob da ein folgbares Signal ist (Telegram /polymarket).
# Ehrlich: Lag wie bei jedem Follower, Märkte dünn - erst messen, dann glauben.
polymarket:
  enabled: false                # 2 Wochen nur Sportwetter geflaggt (kein Krypto-Signal) - aus
  poll_seconds: 600
  min_trade_notional: 5000      # USDC - ab dieser Wettgröße wird die Wallet geprüft
  min_wallet_profit: 10000      # nur Wallets mit nachweisbarem Track-Record melden
  max_checks_per_scan: 5

# === Investigator: Wallets durchleuchten & beobachten ===
# Dossier zu jeder Adresse: python investigate.py 0x...   |   Markt-Puls
# (Funding/OI, gecrowdete Coins): python investigate.py --pulse
# Watchlist: Whales/mutmaßliche MMs - Positionswechsel landen im Journal
# und als Telegram-Alert.
investigator:
  watchlist: []                # z.B. [ "0xabc...", "0xdef..." ]
  poll_seconds: 60
  min_notional_change: 25000   # Alerts erst ab dieser Positionsänderung (USD)

# === Zwei-Bot-Prinzip: Trade-Validator (Bot 2) ===
# Bot 1 (Copy-Engine) schlägt vor, Bot 2 prüft gegen die Markttechnik
# (EMA-Trend 15m+1h, Momentum, RSI-Extreme). Nur wenn BEIDE Ja sagen, wird
# Exposure aufgebaut. Reduzieren/Schließen läuft IMMER durch (Risikoabbau
# braucht keine Genehmigung). Validator-Ausfall = konservativ ablehnen.
validation:
  enabled: true
  interval: 15m            # Trading-Timeframe
  confirm_interval: 1h     # Bestätigungs-Timeframe
  rsi_max_long: 75         # hartes Veto: kein Long darüber
  rsi_min_short: 25        # hartes Veto: kein Short darunter
  min_score: 2             # 2 von 3 Technik-Checks müssen bestehen
  cache_seconds: 120
  llm_enabled: false       # Claude als dritte Stimme (ANTHROPIC_API_KEY in .env)
  llm_model: claude-opus-4-8

# === Multi-Exchange-Konvergenz ===
# Positionierung der Top-Trader auf Binance/OKX/Bybit als Verstärker:
# Übereinstimmung mit unseren HL-Leadern -> Position bis 1.25x größer,
# klarer Widerspruch -> auf 0.4x gedämpft. Nie ein eigener Trade-Auslöser.
# (Das alte Binance-Leaderboard mit Einzel-Wallets wurde von Binance
#  abgeschaltet - aggregierte Top-Trader-Ratios sind das offizielle API.)
convergence:
  enabled: true
  sources: [binance, okx, bybit]
  period: 1h
  agree_boost: 1.25
  disagree_scale: 0.4
  neutral_band: 0.1       # |externe Stimme| darunter = neutral, kein Einfluss
  cache_seconds: 300
